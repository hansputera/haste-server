name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run check:config-docs
      - run: npm run format:check
      - run: npm run build
      - name: node version actually used
        run: node --version
      - run: npm test

  bun:
    name: bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run build
      - name: bun smoke test
        run: |
          PORT=7779 HOST=127.0.0.1 bun src/server.ts &
          server=$!
          for _ in $(seq 1 50); do
            if curl -sf http://127.0.0.1:7779/healthz | grep -q '"status":"ok"'; then
              echo "bun served /healthz"
              kill "$server"
              exit 0
            fi
            sleep 0.2
          done
          echo "bun did not answer /healthz"
          kill "$server" || true
          exit 1

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:openapi
