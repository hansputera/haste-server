name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      # `pnpm/action-setup` reads the version from package.json's packageManager
      # field; without it setup-node's pnpm cache has no pnpm to call.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # `build` comes before `lint`: the serverless entrypoints import
      # `dist/`, and type-aware lint rules cannot resolve what has not been
      # emitted yet.
      - run: pnpm run build
      - run: pnpm run lint
      # The serverless entrypoints import dist/, so this runs after the build.
      - run: pnpm run check:deploy
      - run: pnpm run check:config-docs
      - run: pnpm run check:highlight
      - run: pnpm run format:check
      - name: node version actually used
        run: node --version
      - run: pnpm test

  bun:
    name: bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: bun smoke test
        run: |
          PORT=7779 HOST=127.0.0.1 bun src/server.ts &
          server=$!
          for _ in $(seq 1 50); do
            if curl -sf http://127.0.0.1:7779/healthz | grep -q '"status":"ok"'; then
              echo "bun served /healthz"
              kill "$server"
              exit 0
            fi
            sleep 0.2
          done
          echo "bun did not answer /healthz"
          kill "$server" || true
          exit 1

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm run check:openapi
