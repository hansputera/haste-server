<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- The server replaces everything between these two markers with a paste's
         own tags. What sits here is what a host that serves this file straight
         from its CDN (Vercel, which answers /v2 from static/v2/index.html
         before any rewrite) will ship: a working default, never a stray
         unfilled comment. -->
    <!--haste:og-->
    <title>haste</title>
    <meta property="og:title" content="haste" />
    <meta property="og:description" content="Private pastebin server." />
    <meta property="og:type" content="article" />
    <!--/haste:og-->
    <link rel="icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
